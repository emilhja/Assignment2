services:
  agent:
    build: .
    env_file:
      - .env
    stdin_open: true
    tty: true
    working_dir: /app
    environment:
      AGENT_SESSION_DB: /data/session_history.sqlite3
    volumes:
      - ./workspace:/workspace
      - ./data:/data
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Network stays on so the agent can reach the LLM provider. The bash
    # allowlist (no curl/wget/nc/etc.) is what prevents network commands
    # from being issued by the subprocess.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
