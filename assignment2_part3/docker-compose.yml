services:
  local-hub:
    build:
      context: ..
      dockerfile: assignment2_part3/Dockerfile
    env_file:
      - .env
    command: python tools/local_hub.py --password ${LOCAL_HUB_PASSWORD:?Set LOCAL_HUB_PASSWORD in .env (any value; agents must use the same as RUNPOD_CHAT_PASSWORD)}
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "${LOCAL_HUB_PORT:-8080}:8080"

  agent-alice:
    build:
      context: ..
      dockerfile: assignment2_part3/Dockerfile
    env_file:
      - .env
    environment:
      AGENT_ID: alice
      AGENT_DISPLAY_NAME: alice-swe
      AGENT_MODE: ${AGENT_MODE:-runpod}
      AGENT_WORKSPACE: /workspace/alice
      SHARED_WORKSPACE: /workspace/shared
      AGENT_SESSION_DB: /data/alice.sqlite3
      AGENT_TPM_LIMIT: ${AGENT_TPM_LIMIT:-5500}
      LLM_PROVIDER_ORDER: ${ALICE_LLM_PROVIDER_ORDER:-local}
      LLM_RATE_LIMIT_MAX_WAIT_SECONDS: ${LLM_RATE_LIMIT_MAX_WAIT_SECONDS:-0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
      RUNPOD_CHAT_URL: ${LOCAL_AGENT_HUB_URL:-http://local-hub:8080}
      RUNPOD_CHAT_PASSWORD: ${RUNPOD_CHAT_PASSWORD:?Set RUNPOD_CHAT_PASSWORD in .env (must match LOCAL_HUB_PASSWORD for the local hub)}
      RUNPOD_CHAT_POLL_INTERVAL: ${RUNPOD_CHAT_POLL_INTERVAL:-4}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080}
    depends_on:
      - local-hub
    stdin_open: true
    tty: true
    volumes:
      - ./workspace:/workspace
      - ./data:/data
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  agent-bob:
    build:
      context: ..
      dockerfile: assignment2_part3/Dockerfile
    env_file:
      - .env
    environment:
      AGENT_ID: bob
      AGENT_DISPLAY_NAME: bob-swe
      AGENT_MODE: ${AGENT_MODE:-runpod}
      AGENT_WORKSPACE: /workspace/bob
      SHARED_WORKSPACE: /workspace/shared
      AGENT_SESSION_DB: /data/bob.sqlite3
      AGENT_TPM_LIMIT: ${AGENT_TPM_LIMIT:-5500}
      LLM_PROVIDER_ORDER: ${BOB_LLM_PROVIDER_ORDER:-local,groq}
      LLM_RATE_LIMIT_MAX_WAIT_SECONDS: ${LLM_RATE_LIMIT_MAX_WAIT_SECONDS:-0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
      RUNPOD_CHAT_URL: ${LOCAL_AGENT_HUB_URL:-http://local-hub:8080}
      RUNPOD_CHAT_PASSWORD: ${RUNPOD_CHAT_PASSWORD:?Set RUNPOD_CHAT_PASSWORD in .env (must match LOCAL_HUB_PASSWORD for the local hub)}
      RUNPOD_CHAT_POLL_INTERVAL: ${RUNPOD_CHAT_POLL_INTERVAL:-4}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080}
    depends_on:
      - local-hub
    stdin_open: true
    tty: true
    volumes:
      - ./workspace:/workspace
      - ./data:/data
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
